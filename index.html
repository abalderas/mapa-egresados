.leaflet-tooltip.tooltip-uca{white-space:normal;padding:0;border:none;border-radius:12px;

.leaflet-popup-content-wrapper{border-radius:12px;padding:0;overflow:hidden;}
.tarjeta-uca{font-family:'Segoe UI',Arial,sans-serif;width:300px;max-width:72vw;padding:12px 14px;box-sizing:border-box;}
.persona-cab{display:flex;align-items:center;gap:12px;}
.foto-uca{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;

.nombre-uca{font-weight:700;font-size:15px;color:#066487;line-height:1.2;}
.promo-uca{font-size:11.5px;color:#58595B;}
.puesto-uca{font-size:12px;color:#2B2B2B;margin-top:2px;line-height:1.25;}
.empresa-cab{display:flex;align-items:center;gap:10px;margin:10px 0 8px;padding:8px 0;
  border-top:1px solid #E6E7E8;border-bottom:2.5px solid #D2701A;}
.logo-uca{width:84px;height:40px;object-fit:contain;flex-shrink:0;}
.empresa-uca{font-weight:700;font-size:13px;color:#58595B;line-height:1.2;}
.ciudad-uca{font-size:11px;color:#888C92;}
.cita-uca{font-size:12px;font-style:italic;color:#2B2B2B;line-height:1.4;}
.pista-uca{font-size:10.5px;color:#888C92;margin-top:8px;text-align:right;}
.btn-uca{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:16px;font-size:12.5px;
  font-weight:600;background:#066487;color:#fff !important;text-decoration:none;}
.btn-uca:hover{background:#D2701A;}
.btn-uca.pendiente{background:#E6E7E8;color:#58595B !important;cursor:default;}
.pin-uca{width:18px;height:18px;background:#066487;border:3px solid #D2701A;border-radius:50%;
  box-shadow:0 2px 5px rgba(0,0,0,.35);box-sizing:border-box;}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background-color:rgba(210,112,26,.35) !important;}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background-color:#066487 !important;
  color:#fff;font-weight:700;font-family:'Segoe UI',Arial,sans-serif;}
.titulo-mapa{position:absolute;top:12px;left:56px;z-index:1000;background:rgba(255,255,255,.93);
  padding:8px 14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);
  font-family:'Segoe UI',Arial,sans-serif;border-left:5px solid #D2701A;max-width:70vw;}
.titulo-mapa b{color:#066487;font-size:15px;}
.titulo-mapa span{display:block;color:#58595B;font-size:12px;}
